<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" fill="none">
  <rect width="880" height="220" fill="#f5f5f5" rx="16"/>

  <!-- Card 1: Key Terms -->
  <rect x="20" y="24" width="200" height="172" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <rect x="20" y="24" width="200" height="5" rx="4" fill="url(#gc1)"/>
  <text x="120" y="62" text-anchor="middle" font-family="sans-serif" font-size="28">🏷️</text>
  <text x="120" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#000">Key Terms</text>
  <text x="120" y="116" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">Color-coded domain</text>
  <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">terms alongside chat</text>
  <!-- chips -->
  <rect x="48" y="148" width="52" height="22" rx="11" fill="#d4ffd4"/>
  <text x="74" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a7a1a">positive</text>
  <rect x="108" y="148" width="52" height="22" rx="11" fill="#ffd4d4"/>
  <text x="134" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a1a1a">negative</text>
  <rect x="168" y="148" width="34" height="22" rx="11" fill="#d4eeff"/>
  <text x="185" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1a3d7a">info</text>

  <!-- Card 2: Relevant Context -->
  <rect x="240" y="24" width="200" height="172" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <rect x="240" y="24" width="200" height="5" rx="4" fill="url(#gc2)"/>
  <text x="340" y="62" text-anchor="middle" font-family="sans-serif" font-size="28">🔍</text>
  <text x="340" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#000">Relevant Context</text>
  <text x="340" y="116" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">AI surfaces dataset</text>
  <text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">categories before query</text>
  <rect x="265" y="148" width="150" height="22" rx="6" fill="#f0f0f0"/>
  <text x="340" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">→ revenue  → region  → SKU</text>

  <!-- Card 3: Suggested Questions -->
  <rect x="460" y="24" width="200" height="172" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <rect x="460" y="24" width="200" height="5" rx="4" fill="url(#gc3)"/>
  <text x="560" y="62" text-anchor="middle" font-family="sans-serif" font-size="28">💡</text>
  <text x="560" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#000">Suggested Questions</text>
  <text x="560" y="116" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">Pre-seeded queries to</text>
  <text x="560" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">help users get started</text>
  <rect x="485" y="148" width="150" height="22" rx="6" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="560" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#444">"Top SKUs by revenue?"</text>

  <!-- Card 4: Clean Error Feedback -->
  <rect x="680" y="24" width="180" height="172" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <rect x="680" y="24" width="180" height="5" rx="4" fill="url(#gc4)"/>
  <text x="770" y="62" text-anchor="middle" font-family="sans-serif" font-size="28">⚡</text>
  <text x="770" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#000">Clean Errors</text>
  <text x="770" y="116" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">Direct, actionable</text>
  <text x="770" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">failure messages</text>
  <rect x="700" y="148" width="140" height="22" rx="6" fill="#fff5f5" stroke="#ffd0d0" stroke-width="1"/>
  <text x="770" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c0392b">Try: "Q4 revenue by region"</text>

  <defs>
    <linearGradient id="gc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3bf4fb"/>
      <stop offset="100%" stop-color="#7de8a0"/>
    </linearGradient>
    <linearGradient id="gc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7de8a0"/>
      <stop offset="100%" stop-color="#b8f060"/>
    </linearGradient>
    <linearGradient id="gc3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8f060"/>
      <stop offset="100%" stop-color="#ccff33"/>
    </linearGradient>
    <linearGradient id="gc4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3bf4fb"/>
      <stop offset="100%" stop-color="#ccff33"/>
    </linearGradient>
  </defs>
</svg>
