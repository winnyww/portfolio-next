<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" fill="none">
  <rect width="700" height="200" fill="#f5f5f5" rx="16"/>

  <!-- Metric 1 -->
  <rect x="40" y="40" width="180" height="120" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#000">500+</text>
  <text x="130" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">power users</text>
  <rect x="70" y="126" width="120" height="3" rx="2" fill="url(#gm)"/>

  <!-- Metric 2 -->
  <rect x="260" y="40" width="180" height="120" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <text x="350" y="80" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#000">4–5×</text>
  <text x="350" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">avg session time growth</text>
  <rect x="290" y="126" width="120" height="3" rx="2" fill="url(#gm)"/>

  <!-- Metric 3 -->
  <rect x="480" y="40" width="180" height="120" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
  <text x="570" y="80" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#000">8</text>
  <text x="570" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">features shipped · 4 milestones</text>
  <rect x="510" y="126" width="120" height="3" rx="2" fill="url(#gm)"/>

  <defs>
    <linearGradient id="gm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3bf4fb"/>
      <stop offset="100%" stop-color="#ccff33"/>
    </linearGradient>
  </defs>
</svg>
